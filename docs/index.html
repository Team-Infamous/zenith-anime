<!DOCTYPE html>
<html lang="en" data-accent="emerald">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="Zenith Anime Web — Free anime streaming in your browser across PC, Laptop, Tablet, and Mobile with watch tracking, multi-server playback, and episode guides.">
  <meta name="theme-color" content="#0b0e14">
  <title>Zenith Anime — Web Streaming Edition</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="icon" type="image/svg+xml" href="assets/ic_zenith_logo.svg">
</head>
<body>
  <!-- Accessibility Skip Link -->
  <a href="#app-main-content" class="skip-link">Skip to main content</a>

  <!-- Sticky Glassmorphic Top Navbar -->
  <header class="site-header" id="site-header">
    <div class="container navbar">
      <a href="#home" class="brand" aria-label="Zenith Anime Web Home">
        <div class="brand-icon" aria-hidden="true">
          <img src="assets/ic_zenith_logo.svg" alt="Zenith Anime Emblem" class="brand-logo-img" width="34" height="34">
        </div>
        <div class="brand-text">
          <span class="brand-name">Zenith Anime</span>
          <span class="brand-tag">WEB</span>
        </div>
      </a>

      <!-- Desktop & Laptop Navigation Links -->
      <nav aria-label="Primary Navigation">
        <ul class="nav-links" id="nav-links">
          <li><a href="#home" class="nav-link active">Home</a></li>
          <li><a href="#search" class="nav-link">Catalog</a></li>
          <li><a href="#schedule" class="nav-link">Schedule</a></li>
          <li><a href="#mylist" class="nav-link">My List</a></li>
          <li><a href="#settings" class="nav-link">Settings</a></li>
        </ul>
      </nav>

      <!-- Quick Header Actions -->
      <div class="nav-actions">
        <!-- Quick Search Bar -->
        <form class="header-search-form" id="header-search-form">
          <svg class="header-search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
          <input type="text" class="header-search-input" id="header-search-input" placeholder="Search anime..." aria-label="Quick Search Anime">
        </form>

        <!-- Random Anime Roulette Button -->
        <button type="button" class="btn-header-random" id="header-btn-random" title="Pick Random Anime">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="2" y="2" width="20" height="20" rx="5"></rect>
            <path d="M16 8h.01M8 8h.01M12 12h.01M16 16h.01M8 16h.01"></path>
          </svg>
          <span>Random</span>
        </button>

        <!-- Android Native APK Link -->
        <a href="landing.html" class="btn btn-secondary btn-sm" title="Android Native App">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="5" y="2" width="14" height="20" rx="2" ry="2"></rect>
            <line x1="12" y1="18" x2="12.01" y2="18"></line>
          </svg>
          <span>APK</span>
        </a>
      </div>
    </div>
  </header>

  <!-- Main SPA Content Mount -->
  <main id="app-main-content" class="app-main-content">
    <div class="container" style="padding-top: 60px; text-align: center;">
      <div class="spinner"></div>
      <p style="margin-top: 16px; color: var(--color-text-secondary);">Initializing Zenith Anime Web...</p>
    </div>
  </main>

  <!-- Floating Island Dock Navigation (Mobile & Tablet) -->
  <nav class="mobile-dock-nav" id="mobile-dock-nav" aria-label="Mobile Navigation Dock">
    <a href="#home" class="dock-nav-item active" data-route="home">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
        <polyline points="9 22 9 12 15 12 15 22"></polyline>
      </svg>
      <span>Home</span>
    </a>

    <a href="#search" class="dock-nav-item" data-route="search">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="8"></circle>
        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
      </svg>
      <span>Search</span>
    </a>

    <a href="#schedule" class="dock-nav-item" data-route="schedule">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
        <line x1="16" y1="2" x2="16" y2="6"></line>
        <line x1="8" y1="2" x2="8" y2="6"></line>
        <line x1="3" y1="10" x2="21" y2="10"></line>
      </svg>
      <span>Schedule</span>
    </a>

    <a href="#mylist" class="dock-nav-item" data-route="mylist">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"></path>
      </svg>
      <span>My List</span>
    </a>

    <a href="#settings" class="dock-nav-item" data-route="settings">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="3"></circle>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
      </svg>
      <span>Settings</span>
    </a>
  </nav>

  <!-- Global Toast Notifications Container -->
  <div id="toast-container" class="toast-container" aria-live="polite"></div>

  <!-- Scripts -->
  <script src="js/storage.js"></script>
  <script src="js/api.js"></script>
  <script src="js/player.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
