name: Build & Release Android APK

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - master
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Publish as a GitHub Release (requires tag or release notes)'
        required: false
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Zenith Anime APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/master' }}

      - name: Grant Execute Permission to Gradlew
        run: chmod +x ./gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Prepare APK Artifacts & Checksums
        id: prepare_artifacts
        run: |
          mkdir -p build-artifacts
          cp app/build/outputs/apk/debug/app-debug.apk build-artifacts/zenith-anime-latest.apk
          cp app/build/outputs/apk/debug/app-debug.apk build-artifacts/app-debug.apk
          cd build-artifacts
          sha256sum zenith-anime-latest.apk > checksums.txt
          echo "SHA256 Checksum:"
          cat checksums.txt
          echo "checksum=$(cat checksums.txt | awk '{print $1}')" >> $GITHUB_OUTPUT

      - name: Upload APK Artifact (Actions Tab)
        uses: actions/upload-artifact@v4
        with:
          name: zenith-anime-apk
          path: |
            build-artifacts/*.apk
            build-artifacts/checksums.txt
          retention-days: 30

      - name: Publish GitHub Release (On Tag Push)
        if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.create_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build-artifacts/zenith-anime-latest.apk
            build-artifacts/app-debug.apk
            build-artifacts/checksums.txt
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
