name: Build & Release Android APK

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - master
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Publish as a GitHub Release (requires tag or release notes)'
        required: false
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Zenith Anime APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/master' }}

      - name: Grant Execute Permission to Gradlew
        run: chmod +x ./gradlew

      - name: Build Debug APK
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Prepare APK Artifacts & Checksums
        id: prepare_artifacts
        run: |
          mkdir -p build-artifacts
          cp app/build/outputs/apk/debug/app-debug.apk build-artifacts/zenith-anime-latest.apk
          cp app/build/outputs/apk/debug/app-debug.apk build-artifacts/app-debug.apk
          cd build-artifacts
          sha256sum zenith-anime-latest.apk > checksums.txt
          echo "SHA256 Checksum:"
          cat checksums.txt
          echo "checksum=$(cat checksums.txt | awk '{print $1}')" >> $GITHUB_OUTPUT

      - name: Upload APK Artifact (Actions Tab)
        uses: actions/upload-artifact@v4
        with:
          name: zenith-anime-apk
          path: |
            build-artifacts/*.apk
            build-artifacts/checksums.txt
          retention-days: 30

      - name: Publish GitHub Release (On Tag Push)
        if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.create_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build-artifacts/zenith-anime-latest.apk
            build-artifacts/app-debug.apk
            build-artifacts/checksums.txt
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Send Discord Notification (Zenith Bot)
        if: always()
        run: |
          STATUS="${{ job.status }}"
          if [ "$STATUS" = "success" ]; then
            COLOR=1096065
            STATUS_TEXT="✅ Android APK Build Successful"
          else
            COLOR=15679844
            STATUS_TEXT="❌ Android APK Build Failed"
          fi
          
          curl -H "Content-Type: application/json" -X POST -d '{
            "username": "Zenith Bot",
            "embeds": [
              {
                "title": "'"$STATUS_TEXT"'",
                "description": "Triggered by: **${{ github.actor }}**\nBranch: `'"${{ github.ref_name }}"'`\nCommit: [\`${{ github.sha }}\`](https://github.com/gokuthug1/zenith-anime/commit/${{ github.sha }})\n\n[View Cloud Build & Download APK](https://github.com/gokuthug1/zenith-anime/actions/runs/${{ github.run_id }})",
                "color": '"$COLOR"',
                "footer": {
                  "text": "Zenith Anime CI/CD Cloud Dispatch"
                }
              }
            ]
          }' "https://discord.com/api/webhooks/1560148186603986954/SBEHpZMoFsUp9NO66_ag5E4cm2VIORZ6xFNrizycEwzZLAsuXYyZAixZuJYYCYbLlJCR" || true

